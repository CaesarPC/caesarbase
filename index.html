<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaesarBase — 个人主站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#1a1a2e;--border:#2a2a4a;--green:#50fa7b;--blue:#8be9fd;--text:#e6e6f0;--dim:#6272a4}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:60px 20px}
.hero{text-align:center;padding:40px 0 60px;animation:fadeUp .8s ease}
.hero h1{font-size:56px;font-weight:800;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
.hero p{color:var(--dim);font-size:17px;margin-top:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);text-decoration:none;color:var(--text);display:block}
.card:hover{transform:translateY(-4px);border-color:var(--green);box-shadow:0 12px 40px rgba(80,250,123,.12)}
.card .icon{font-size:36px;margin-bottom:14px}
.card h3{font-size:20px;margin-bottom:8px}
.card p{color:var(--dim);font-size:14px;line-height:1.6}
.card .tag{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:20px;font-size:12px;background:rgba(80,250,123,.1);color:var(--green)}
.coming{opacity:.5}
footer{text-align:center;padding:40px 0 20px;color:var(--dim);font-size:13px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.hero h1{font-size:38px}.wrap{padding:40px 16px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <div class="hero">
    <h1>CaesarBase</h1>
    <p>一个人的主站 · 工具 · 社区 · 文章 · 棒球</p>
  </div>
  <div class="cards">
    <a class="card" href="https://caesarpc.github.io">
      <div class="icon">🧰</div>
      <h3>Cr工具站</h3>
      <p>域名查找、编码转换、文件转换、二维码、小游戏等实用工具集合。</p>
      <span class="tag">立即前往 →</span>
    </a>
    <div class="card coming">
      <div class="icon">💬</div>
      <h3>社区留言</h3>
      <p>留言墙、弹幕、用户系统，和站长互动。</p>
      <span class="tag">即将上线</span>
    </div>
    <div class="card coming">
      <div class="icon">📝</div>
      <h3>技术文章</h3>
      <p>96篇深度技术文章，前端后端全栈全覆盖。</p>
      <span class="tag">即将上线</span>
    </div>
    <div class="card coming">
      <div class="icon">⚾</div>
      <h3>棒球专区</h3>
      <p>青少年棒球、装备推荐、赛事信息。</p>
      <span class="tag">即将上线</span>
    </div>
  </div>
  <footer>© 2026 CaesarBase · Built by CaesarPC</footer>
</div>
<script>
const c=document.getElementById('stars'),ctx=c.getContext('2d');
let stars=[];
function resize(){c.width=innerWidth;c.height=innerHeight;init()}
function init(){stars=[];for(let i=0;i<80;i++){stars.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*3,vy:Math.random()*2+1,len:Math.random()*80+20,alpha:Math.random()*.5+.2})}}
function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.x+=s.vx;s.y+=s.vy;if(s.y>c.height+50){s.y=-50;s.x=Math.random()*c.width}const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*s.len,s.y-s.vy*s.len);g.addColorStop(0,`rgba(139,242,253,${s.alpha})`);g.addColorStop(1,'rgba(139,242,253,0)');ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*s.len,s.y-s.vy*s.len);ctx.stroke()});requestAnimationFrame(draw)}
resize();draw();window.addEventListener('resize',resize)
</script>
</body>
</html>
