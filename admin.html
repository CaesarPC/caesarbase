<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server后台 — CaesarBase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#1a1a2e;--border:#2a2a4a;--green:#50fa7b;--blue:#8be9fd;--red:#ff5555;--text:#e6e6f0;--dim:#6272a4}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:rgba(20,20,35,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.topbar .logo{font-size:18px;font-weight:700;color:var(--red)}
.wrap{max-width:900px;margin:0 auto;padding:30px 20px}
h1{font-size:24px;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px}
.panel h3{font-size:16px;color:var(--blue);margin-bottom:12px}
.panel p{font-size:14px;color:var(--dim);line-height:1.6}
.login-box{max-width:400px;margin:80px auto;text-align:center}
.login-box input{width:100%;background:#0f0f1a;border:1px solid var(--border);border-radius:8px;padding:14px;color:var(--text);font-size:15px;margin:8px 0;text-align:center}
.login-box button{width:100%;background:var(--red);color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;cursor:pointer;margin-top:10px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.stat div{background:#0f0f1a;border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat .num{font-size:28px;font-weight:700;color:var(--green)}
.stat .label{font-size:12px;color:var(--dim);margin-top:4px}
a{color:var(--green)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">⚠ Server 后台管理</div>
  <a href="main.html" style="color:var(--dim);font-size:14px">返回主站</a>
</div>
<div class="wrap" id="loginBox" class="login-box">
  <div class="login-box">
    <h1 style="color:var(--red)">Server 登录</h1>
    <input type="password" id="pwd" placeholder="输入管理员密码" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">登录</button>
  </div>
</div>
<div class="wrap" id="adminPanel" style="display:none">
  <h1>后台管理面板</h1>
  
  <div class="panel">
    <h3>📊 站点概览</h3>
    <div class="stat">
      <div><div class="num" id="articleCount">-</div><div class="label">文章总数</div></div>
      <div><div class="num" id="toolCount">-</div><div class="label">工具页面</div></div>
      <div><div class="num">2</div><div class="label">站点</div></div>
    </div>
  </div>

  <div class="panel">
    <h3>🔗 站点管理</h3>
    <p><a href="https://caesarpc.github.io" target="_blank">Cr工具站</a> · 主工具站</p>
    <p style="margin-top:6px"><a href="main.html">CaesarBase主站</a> · 导流+社区</p>
  </div>

  <div class="panel">
    <h3>📢 合作申请管理</h3>
    <p>查看品牌导流合作申请。</p>
    <p style="margin-top:8px"><a href="https://github.com/CaesarPC/caesarbase" target="_blank">在GitHub查看api_data/sponsors.json →</a></p>
  </div>

  <div class="panel">
    <h3>⚙ 版本管理</h3>
    <p>当前版本：alpha-1.4.4（Cr工具站）</p>
    <p>CaesarBase：v0.1（初始版本）</p>
  </div>

  <button onclick="logout()" style="background:var(--red);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer">退出登录</button>
</div>
<script>
function login(){
  const p=document.getElementById('pwd').value;
  if(p==='314314314'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    loadStats();
  }else{
    alert('密码错误');
  }
}
async function loadStats(){
  try{
    const r=await fetch('https://caesarpc.github.io/articles.html?ts='+Date.now());
    const html=await r.text();
    const tmp=document.createElement('div');tmp.innerHTML=html;
    document.getElementById('articleCount').textContent=tmp.querySelectorAll('.article-item').length;
  }catch(e){document.getElementById('articleCount').textContent='?'}
  document.getElementById('toolCount').textContent='14';
}
function logout(){
  document.getElementById('pwd').value='';
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('loginBox').style.display='block';
}
</script>
</body>
</html>
